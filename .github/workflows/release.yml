name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate tag is PEP 440
        id: validate
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          python -c "from packaging.version import Version; Version('$tag')" || {
            echo "::error::Tag '${GITHUB_REF_NAME}' is not a valid PEP 440 version. Use e.g. v2.2.0, v2.2.0a1, v2.2.0b1, v2.2.0rc1 (not v2.2.0-beta1)."
            exit 1
          }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Build distributions
        run: uv build

      - name: Detect pre-release
        id: prerelease
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          is_pre=$(python -c "from packaging.version import Version; print(str(Version('$tag').is_prerelease).lower())")
          echo "prerelease=$is_pre" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ steps.prerelease.outputs.prerelease }}
