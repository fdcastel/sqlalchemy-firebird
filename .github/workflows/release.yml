name: release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.prerelease.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # setuptools-scm needs full history + tags

      - name: Validate tag is PEP 440
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          python -c "from packaging.version import Version; Version('$tag')" || {
            echo "::error::Tag '${GITHUB_REF_NAME}' is not a valid PEP 440 version. Use e.g. v2.2.0, v2.2.0a1, v2.2.0b1, v2.2.0rc1 (not v2.2.0-beta1)."
            exit 1
          }

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Build distributions
        run: uv build

      - name: Detect pre-release
        id: prerelease
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          is_pre=$(python -c "from packaging.version import Version; print(str(Version('$tag').is_prerelease).lower())")
          echo "prerelease=$is_pre" >> "$GITHUB_OUTPUT"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ needs.build.outputs.prerelease }}

  publish-pypi:
    needs: build
    if: needs.build.outputs.prerelease == 'false'   # finals only
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sqlalchemy-firebird/
    permissions:
      id-token: write                                # OIDC; no secrets
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
