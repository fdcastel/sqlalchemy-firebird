name: test

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: uv sync
        run: uv sync
      - name: ruff check
        run: uv run ruff check
      - name: ruff format --check
        run: uv run ruff format --check

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Two dimensions with very different value:
      #   * Firebird version is where almost every dialect bug lives, so the
      #     full 3.0/4.0/5.0 sweep runs on both OSes at the latest Python.
      #   * Python version rarely matters for a pure-Python dialect, so we
      #     bracket it: the supported floor (3.11) and the latest (3.14). The
      #     floor is smoke-tested against the latest Firebird per OS; the
      #     excludes below drop the low-value floor x old-Firebird cells.
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.11', '3.14']
        firebird-version: ['3.0.14', '4.0.7', '5.0.4']
        exclude:
          - python-version: '3.11'
            firebird-version: '3.0.14'
          - python-version: '3.11'
            firebird-version: '4.0.7'
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          # Distinct suffix per matrix cell so cells don't race on a shared
          # cache key.
          cache-suffix: ${{ matrix.os }}-py${{ matrix.python-version }}-fb${{ matrix.firebird-version }}
      - name: uv sync
        run: uv sync
      - name: Install PSFirebird
        shell: pwsh
        run: |
          Install-Module PSFirebird -Scope CurrentUser -Force
      - name: Provision Firebird ${{ matrix.firebird-version }}
        shell: pwsh
        run: |
          Import-Module PSFirebird
          $envPath = Join-Path $env:RUNNER_TEMP "fb-${{ matrix.firebird-version }}"
          $envObj = New-FirebirdEnvironment -Version "${{ matrix.firebird-version }}" -Path $envPath -Force
          $dbPath = Join-Path $envPath 'sqlalchemy-firebird-tests.fdb'
          $db = New-FirebirdDatabase -Database $dbPath -Environment $envObj -Force
          $clientLibrary = $envObj.GetClientLibraryPath()
          $dbUri = "firebird+firebird://sysdba@/$($db.Path -replace '\\','/')?charset=UTF8&fb_client_library=$($clientLibrary -replace '\\','/')"
          "FIREBIRD_DBURI=$dbUri" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Configured FIREBIRD_DBURI=$dbUri"
      - name: pytest
        shell: pwsh
        run: |
          uv run pytest --dburi $env:FIREBIRD_DBURI
